<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen Grip TA-v2.0</title>
<meta name="description" content="SO-101 用グリッパーフィンガーをブラウザ上で設計し、STEP と STL で書き出します。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-128.png">
</head>
<body>

<header class="top">
  <div class="brand">
    <img class="brand-logo" src="assets/logo-64.png" alt="" width="28" height="28">
    <span class="brand-name">Gen&nbsp;Grip</span>
    <span class="brand-ver">TA-v2.0</span>
  </div>
  <div class="tagline" data-t="tagline"></div>
  <div class="spacer"></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="seg" id="langSeg" aria-label="Language">
    <button data-lang="ja">日本語</button>
    <button data-lang="en">EN</button>
  </div>
</header>

<main class="grid">

  <section class="stage">
    <div class="stagebar">
      <span class="dims" id="dims"></span>
      <div class="spacer"></div>
      <div class="seg" id="viewSeg">
        <button data-v="iso" class="on" data-t="view_iso"></button>
        <button data-v="front" data-t="view_front"></button>
        <button data-v="side" data-t="view_side"></button>
        <button data-v="top" data-t="view_top"></button>
      </div>
    </div>
    <div class="canvaswrap" id="canvasWrap">
      <canvas id="cv" aria-label="3D preview"></canvas>
      <div class="hint" data-t="hint"></div>
    </div>
  </section>

  <aside class="panel left" id="controls">
    <section class="block">
      <h2 data-t="templates"></h2>
      <div class="templates" id="templates"></div>
      <p class="tpl-blurb" id="templateBlurb"></p>
    </section>

    <section class="block">
      <label class="switch">
        <input type="checkbox" id="symChk" checked>
        <span class="track"><span class="knob"></span></span>
        <span class="switch-txt" data-t="symmetric"></span>
      </label>
      <div class="tabs" id="fingerTabs" hidden></div>
    </section>

    <div id="sliders"></div>
  </aside>

  <aside class="panel right">
    <section class="block">
      <h2 data-t="summary"></h2>
      <dl class="facts" id="summary"></dl>
      <ul class="warns" id="warns"></ul>
    </section>

    <section class="block">
      <h2 data-t="export"></h2>
      <div id="exports"></div>
      <div class="fmtnote">
        <p><b data-t="export_step_h"></b> <span data-t="export_step"></span></p>
        <p><b data-t="export_stl_h"></b> <span data-t="export_stl"></span></p>
      </div>
    </section>

    <section class="block howto">
      <h2 data-t="howto"></h2>
      <div class="step">
        <b class="step-h" data-t="howto_fingers_h"></b>
        <p data-t="howto_fingers"></p>
      </div>
      <div class="step">
        <b class="step-h" data-t="howto_mount_h"></b>
        <p data-t="howto_mount"></p>
        <a class="dl ext"
           href="https://github.com/Vector-Wangel/XLeRobot/blob/main/hardware/SO101_soft_fin.stl"
           target="_blank" rel="noopener">
          <span>SO101_soft_fin.stl</span><em>XLeRobot ↗</em>
        </a>
        <p class="credit" data-t="howto_mount_credit"></p>
      </div>
      <p class="engine" data-t="engine"></p>
    </section>
  </aside>

</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
